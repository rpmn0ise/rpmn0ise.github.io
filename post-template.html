<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - RPMN0ISE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #2e3440; color: #eceff4; line-height: 1.8; }
        nav { background: rgba(59, 66, 82, 0.95); padding: 15px 30px; border-bottom: 1px solid rgba(136, 192, 208, 0.3); position: sticky; top: 0; z-index: 100; }
        nav ul { list-style: none; display: flex; gap: 25px; flex-wrap: wrap; }
        nav a { color: #eceff4; text-decoration: none; transition: 0.3s; }
        nav a:hover { color: #88c0d0; }
        .container { max-width: 800px; margin: 80px auto; padding: 0 20px; }
        .post-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3rem); background: linear-gradient(135deg, #88c0d0, #5e81ac); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .post-meta { color: #81a1c1; margin-bottom: 30px; }
        .post-cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin: 30px 0; }
        .post-content { font-size: 1.1rem; }
        .post-content h2 { font-family: 'Orbitron', sans-serif; margin: 40px 0 20px; color: #88c0d0; }
        .post-content p { margin: 20px 0; }
        .post-content ul { margin: 20px 0; padding-left: 30px; }
        .post-content a { color: #88c0d0; }
        footer { background: #3b4252; padding: 40px 20px; text-align: center; margin-top: 100px; border-top: 1px solid rgba(136, 192, 208, 0.3); }
    </style>
  <link rel="stylesheet" href="assets/css/rpmn0ise.css">
</head>
<body>

<nav>
    <ul>
        <li><a href="/" style="font-family:'Orbitron',sans-serif;font-weight:700">RPMN0ISE</a></li>
        <li><a href="/">Hub</a></li>
        <li><a href="/blog">Blog</a></li>
    </ul>
</nav>

<div class="container">
    <article>
        <h1 class="post-title">{{TITLE}}</h1>
        <div class="post-meta">📅 {{DATE}} • {{CATEGORIES}}</div>
        
        <div class="post-content">
            {{CONTENT}}
        </div>
    </article>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <span class="footer-copy mono">&copy; 2026 RPMN0ISE &mdash; built by hand, no frameworks harmed</span>
      <div class="footer-links">
        <a href="https://github.com/rpmn0ise" target="_blank" rel="noopener">GitHub</a>
        <a href="https://steamcommunity.com/id/TherockyRPM/" target="_blank" rel="noopener">Steam</a>
        <a href="https://instagram.com/rpmn0ise" target="_blank" rel="noopener">Instagram</a>
        <a href="https://reddit.com/user/rpmn0ise" target="_blank" rel="noopener">Reddit</a>
      </div>
    </div>
  </div>
</footer>

</body>
</html>
