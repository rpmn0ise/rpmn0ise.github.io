<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SYS://CARD v0.3 — Hacker TCG</title>
  <meta name="description" content="Jeu de cartes à collectionner dans l'univers IT, hacking et Linux."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💾</text></svg>"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css"/>

  <!-- React 18 + Babel (CDN, aucun build requis) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root">
    <!-- Splash shown while JS loads -->
    <div id="splash">
      <div class="splash-logo">SYS://CARD</div>
      <div class="splash-sub">LOADING...</div>
    </div>
  </div>

  <!--
    ORDRE DE CHARGEMENT IMPORTANT :
    1. api.js      → appels réseau (pas de dépendances)
    2. data.js     → ALL_CARDS, FAMILIES, RARITIES (utilisé partout)
    3. components.js → Card, Btn, HPBar... (dépend de data.js)
    4. battle.js   → ScreenBattle PvE (dépend de components.js + data.js)
    5. pvp.js      → ScreenPvP (dépend de components.js + api.js)
    6. packscreen.js → ScreenPackOpen (dépend de components.js + api.js + data.js)
    7. screens.js  → Collection, Deck, Trade, Login (dépend de tout)
    8. admin.js    → ScreenAdmin (dépend de api.js + components.js)
    9. app.js      → App root — monté en dernier
  -->
  <script type="text/babel" data-presets="react" src="js/api.js"></script>
  <script type="text/babel" data-presets="react" src="js/data.js"></script>
  <script type="text/babel" data-presets="react" src="js/components.js"></script>
  <script type="text/babel" data-presets="react" src="js/battle.js"></script>
  <script type="text/babel" data-presets="react" src="js/pvp.js"></script>
  <script type="text/babel" data-presets="react" src="js/packscreen.js"></script>
  <script type="text/babel" data-presets="react" src="js/screens.js"></script>
  <script type="text/babel" data-presets="react" src="js/admin.js"></script>
  <script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
