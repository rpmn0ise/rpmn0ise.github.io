site_name: RPMN0ISE Wiki
site_url: https://rpmn0ise.github.io/wiki/
use_directory_urls: false

theme:
  name: material
  language: fr
  # Configuration des couleurs (Mode Sombre style FMHY)
  palette:
    - scheme: slate
      primary: black
      accent: indigo
  features:
    - navigation.tabs          # Menu en haut
    - navigation.sections      # Sections cliquables à gauche
    - navigation.expand        # Auto-développement des menus
    - navigation.top           # Bouton retour en haut
    - search.suggest           # Recherche intelligente
    - search.highlight         # Surlignage des résultats
    - content.code.copy        # Bouton copier sur le code

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
