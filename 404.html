<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Introuvable</title>
    <link rel="stylesheet" href="assets/css/style-unified.css">
    <style>
        /* Styles spécifiques 404 */
        body.404-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
        }

        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .error-desc {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
        }

        .btn-home {
            background: var(--accent-primary);
            color: var(--bg-primary);
            padding: 12px 30px;
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition-normal);
        }

        .btn-home:hover {
            background: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(136, 192, 208, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="404-page">
    <div class="error-code">404</div>
    <div class="error-message gradient-text">Oups ! Page introuvable</div>
    <p class="error-desc">
        La page que vous cherchez n'existe pas ou a été déplacée.  
        Vous pouvez retourner à l'accueil pour continuer votre aventure.
    </p>
    <a href="/" class="btn-home">Retour à l'accueil</a>
</body>
</html>
