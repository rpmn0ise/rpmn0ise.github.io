<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="../../../assets/css/rpmn0ise.css">
</head>
<body>
<header>
    <a href="index.html">← Back</a>
    <h1 id="title">Loading...</h1>
</header>

<main id="content" style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
    Loading...
</main>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get('file');

if(file){
    fetch(file)
        .then(r => r.text())
        .then(text => {
            document.getElementById('content').innerHTML = marked.parse(text);

            // Titre automatique depuis le premier H1
            const firstLine = text.split('\n')[0];
            if(firstLine.startsWith('# ')){
                document.getElementById('title').textContent = firstLine.replace('# ', '');
            }
        })
        .catch(err => {
            document.getElementById('content').textContent = 'Failed to load Markdown.';
            console.error(err);
        });
}else{
    document.getElementById('content').textContent = 'No file specified.';
}
</script>
</body>
</html>
