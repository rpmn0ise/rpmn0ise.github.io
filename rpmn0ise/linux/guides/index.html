<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Guides</title>
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<header>
    <h1>Linux Guides</h1>
    <a href="../index.html">← Back to Linux</a>
</header>

<main>
<ul id="list"></ul>
</main>

<script>
async function listMarkdown() {
    const listEl = document.getElementById('list');
    const files = [
        'arch_zfs-on-root.md',
        'apparmor-p-gen.md',
        'debian11-server.md',
        'luks2_cryptsetup.md',
        'mp3-workflow.md',
        'nixos_flakes.md'
    ]; // <-- Ici tu peux mettre la liste de fichiers Markdown. 
    // Plus tard on peut générer cette liste automatiquement avec un script Python avant le push.

    files.forEach(f=>{
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `view.html?file=${f}`;
        a.textContent = f.replace('.md','').replace(/_/g,' ');
        li.appendChild(a);
        listEl.appendChild(li);
    });
}

listMarkdown();
</script>
</body>
</html>
