name: publish wiki
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material

      - name: Build Wiki
        run: |
          # On entre dans le dossier wiki pour construire le site
          cd wiki
          mkdocs build
          
      - name: Prepare Root Site
        run: |
          # Cette étape copie ton site principal dans le dossier de déploiement
          # pour éviter la 404 à la racine du site
          cp index.html wiki/site/index.html
          cp -r assets wiki/site/assets || true
          cp -r css wiki/site/css || true
          cp -r js wiki/site/js || true
          cp robots.txt wiki/site/robots.txt || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # On publie tout le contenu du site construit
          publish_dir: ./wiki/site
          # On garde 'wiki' comme destination pour que l'URL reste /wiki/
          destination_dir: . 
          keep_files: true
